<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Prodotto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .contenitore-form { background: white; padding: 30px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; color: #007bff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        input[type="file"] { margin-top: 5px; }
        button { background-color: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        .link-indietro { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
        .info-foto { font-size: 12px; color: #666; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div class="contenitore-form">
        <h2>Inserisci Nuovo Annuncio</h2>
        
        <form action="/api/prodotti" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="titolo">Cosa vendi?</label>
                <input type="text" id="titolo" name="titolo" required>
            </div>

            <div class="form-group">
                <label for="prezzo">Prezzo (€)</label>
                <input type="number" id="prezzo" name="prezzo" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="condizione">Condizione</label>
                <select id="condizione" name="condizione">
                    <option value="Nuovo">Nuovo</option>
                    <option value="Usato">Usato</option>
                </select>
            </div>

            <div class="form-group">
                <label for="immagine">Foto del prodotto</label>
                <!-- Il trucco è l'attributo "multiple" che permette di selezionare più file -->
                <input type="file" id="immagini" name="immagini" accept="image/*" multiple required>
                <span class="info-foto">Tieni premuto CTRL (o CMD) per selezionare fino a 6 foto.</span>
            </div>

            <!-- Il campo password è stato rimosso, il server userà il cookie! -->
            <button type="submit">Pubblica Annuncio</button>
        </form>

        <a href="/admin.html" class="link-indietro">Torna al Pannello di Controllo</a>
    </div>

</body>
</html>
