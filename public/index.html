<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il Mio Magazzino</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .aggiungi-btn { display: block; width: 200px; margin: 0 auto 30px; text-align: center; background-color: #27ae60; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        
        /* La Griglia dei Prodotti */
        #griglia-prodotti { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        /* La singola Card del prodotto */
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .card p { flex-grow: 1; font-size: 0.9rem; color: #666; }
        .prezzo { font-size: 1.3rem; font-weight: bold; color: #e74c3c; margin-top: 10px; }
        .condizione { display: inline-block; background: #eee; padding: 3px 8px; border-radius: 10px; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Il Mio Magazzino 📦</h1>
    <a href="/aggiungi.html" class="aggiungi-btn">+ Aggiungi Prodotto</a>

    <div id="griglia-prodotti">
        <!-- I prodotti verranno caricati qui dentro da JavaScript -->
    </div>

    <script>
        // Appena la pagina si carica, chiediamo i prodotti al server
        async function caricaProdotti() {
            try {
                const risposta = await fetch('/api/prodotti');
                const prodotti = await risposta.json();
                
                const contenitore = document.getElementById('griglia-prodotti');
                
                // Per ogni prodotto trovato nel database, creiamo una "card" HTML
                prodotti.forEach(prodotto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Costruiamo l'interno della card
                    card.innerHTML = `
                        <img src="${prodotto.immagine || 'https://via.placeholder.com/250x200?text=Nessuna+Foto'}" alt="${prodotto.titolo}">
                        <h3>${prodotto.titolo}</h3>
                        <p>${prodotto.descrizione}</p>
                        <span class="condizione">${prodotto.condizione || 'N/A'}</span>
                        <div class="prezzo">€ ${prodotto.prezzo.toFixed(2)}</div>
                    `;
                    
                    contenitore.appendChild(card);
                });
            } catch (errore) {
                console.error("Errore nel caricamento:", errore);
            }
        }

        // Eseguiamo la funzione
        caricaProdotti();
    </script>
</body>
</html>
