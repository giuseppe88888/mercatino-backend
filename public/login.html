<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Riservato - Il Mio Mercatino</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }
        
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 350px; }
        .logo { font-size: 24px; font-weight: 900; color: #333; text-decoration: none; letter-spacing: -0.5px; margin-bottom: 20px; display: block; }
        .logo span { color: #e53935; }
        
        input { width: 100%; padding: 14px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #f9fafb; text-align: center; }
        input:focus { outline: none; border-color: #e53935; box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.1); }
        
        button { width: 100%; background: #e53935; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #c62828; }
        
        #messaggio-errore { color: #dc2626; margin-top: 15px; font-weight: bold; font-size: 14px; display: none; }
        .info { font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">Area<span>Gestione</span></div>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Inserisci la password di amministrazione per accedere al magazzino.</p>
        
        <input type="password" id="password" placeholder="Password Admin" onkeypress="inviaConInvio(event)">
        <button onclick="faiLogin()">Accedi al Gestionale</button>
        
        <p id="messaggio-errore">❌ Password errata. Riprova.</p>
        <p class="info">Torna alla <a href="/index.html" style="color: #e53935;">Vetrina Pubblica</a></p>
    </div>

    <script>
        // Permette di premere "Invio" sulla tastiera per fare il login
        function inviaConInvio(event) {
            if (event.key === "Enter") {
                faiLogin();
            }
        }

        async function faiLogin() {
            const password = document.getElementById('password').value;
            const msgErrore = document.getElementById('messaggio-errore');

            try {
                const risposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                if (risposta.ok) {
                    // Login corretto! Ci ricarica sulla rotta "gestione" (che ora ci farà passare)
                    window.location.href = '/gestione';
                } else {
                    msgErrore.style.display = 'block';
                    document.getElementById('password').value = ''; // Pulisce il campo
                }
            } catch (err) {
                alert('Errore di connessione');
            }
        }
    </script>
</body>
</html>
