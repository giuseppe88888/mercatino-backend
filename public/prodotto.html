<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Annuncio - Il Mio Mercatino</title>
    <style>
        /* --- STILI BASE E RESET --- */
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; background-color: #f4f5f7; margin: 0; padding: 0; color: #333; }
        
        /* --- HEADER --- */
        .navbar { background-color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; color: #333; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: #e53935; }
        .btn-header { color: #555; text-decoration: none; font-weight: 600; font-size: 15px; }
        
        /* --- LAYOUT A DUE COLONNE --- */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .breadcrumb { margin-bottom: 20px; font-size: 14px; color: #666; }
        .breadcrumb a { color: #007bff; text-decoration: none; }
        
        .layout-prodotto { display: flex; gap: 30px; align-items: flex-start; }
        .colonna-sinistra { flex: 2; min-width: 0; } 
        .colonna-destra { flex: 1; min-width: 320px; position: sticky; top: 90px; }

        .card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 25px; margin-bottom: 20px; }

        /* --- IMMAGINI E BADGE --- */
        .foto-principale-container { width: 100%; height: 450px; background-color: #f9fafb; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .foto-principale { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .miniature { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .miniature img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.6; transition: 0.2s; }
        .miniature img.attiva { opacity: 1; border-color: #e53935; }

        h1 { margin: 0 0 5px 0; font-size: 24px; line-height: 1.3; color: #111; }
        .codice-articolo { font-size: 13px; color: #888; font-family: monospace; margin-bottom: 15px; display: block; }
        .prezzo { font-size: 32px; font-weight: 900; color: #111; margin-bottom: 20px; }
        
        .badges { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { font-size: 12px; color: #555; text-transform: uppercase; background-color: #f3f4f6; padding: 6px 10px; border-radius: 4px; font-weight: 700; }
        .badge.categoria { background-color: #ffebee; color: #c62828; }
        
        /* Nuovi Badge di Stato */
        .badge.stato-disponibile { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge.stato-prenotato { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .badge.stato-venduto { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Bottone WhatsApp */
        .btn-whatsapp { background: #25D366; color: white; text-align: center; text-decoration: none; padding: 16px; border-radius: 8px; font-weight: bold; font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; }
        .btn-whatsapp:hover { background: #1ebe57; transform: translateY(-2px); }
        .btn-whatsapp.disabilitato { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; pointer-events: none; }

        h3 { font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-top: 0; }
        .descrizione { font-size: 16px; line-height: 1.6; color: #444; white-space: pre-wrap; margin-top: 15px; }

        @media (max-width: 850px) {
            .layout-prodotto { flex-direction: column; }
            .colonna-destra { width: 100%; position: static; }
            .foto-principale-container { height: 300px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/index.html" class="logo">IlMio<span>Mercatino</span></a>
        <a href="/index.html" class="btn-header">Torna alla Vetrina</a>
    </nav>

    <main class="container" id="dettaglio-prodotto">
        <div style="text-align: center; margin-top: 50px;">Caricamento in corso...</div>
    </main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const idProdotto = urlParams.get('id');
    const contenitore = document.getElementById('dettaglio-prodotto');
    
    // IL TUO NUMERO (es: 393331234567)
    const numeroWhatsApp = "393331234567"; 

    async function caricaProdotto() {
        if (!idProdotto) return contenitore.innerHTML = "<h2>Prodotto non trovato.</h2>";
        try {
            const risposta = await fetch('/api/prodotti/' + idProdotto);
            if (!risposta.ok) throw new Error("Inesistente");
            const prodotto = await risposta.json();
            mostraProdotto(prodotto);
        } catch (errore) {
            contenitore.innerHTML = "<h2>Errore: " + errore.message + "</h2>";
        }
    }

    function mostraProdotto(prodotto) {
        const prezzo = Number(prodotto.prezzo).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
        
        // RECUPERA I NUOVI DATI (o usa valori di default se è un vecchio annuncio)
        const stato = prodotto.stato_vendita || 'Disponibile';
        const codice = prodotto.codice_articolo || 'N/A';
        
        // COMPOSIZIONE MESSAGGIO WHATSAPP PROFESSIONALE
        const msg = encodeURIComponent(`Ciao! Sono interessato all'articolo #${codice} - ${prodotto.titolo}. È ancora disponibile?`);
        const linkWA = `https://wa.me/${numeroWhatsApp}?text=${msg}`;
        
        // CLASSE CSS PER IL BADGE DI STATO
        let classeStato = 'stato-disponibile';
        let iconaStato = '🟢';
        let btnDisabilitato = '';
        let testoBtn = 'Contatta su WhatsApp';

        if (stato === 'Prenotato') {
            classeStato = 'stato-prenotato'; iconaStato = '🟡';
        } else if (stato === 'Venduto') {
            classeStato = 'stato-venduto'; iconaStato = '🔴';
            btnDisabilitato = 'disabilitato'; 
            testoBtn = 'Articolo non più disponibile';
        }
        
        let immagini = prodotto.immagini && prodotto.immagini.length > 0 ? prodotto.immagini : ['https://via.placeholder.com/800x600?text=No+Foto'];
        let miniatureHTML = immagini.map((url, i) => `<img src="${url}" class="${i===0?'attiva':''}" onclick="cambiaFoto(this, '${url}')">`).join('');

        contenitore.innerHTML = `
            <div class="breadcrumb">
                <a href="/index.html">Vetrina</a> &gt; ${prodotto.categoria || 'Varie'} &gt; ${prodotto.titolo}
            </div>

            <div class="layout-prodotto">
                <!-- SINISTRA: Foto e Descrizione -->
                <div class="colonna-sinistra">
                    <div class="card" style="padding: 15px;">
                        <div class="foto-principale-container">
                            <img src="${immagini[0]}" id="foto-grande" class="foto-principale">
                        </div>
                        <div class="miniature">${miniatureHTML}</div>
                    </div>
                    <div class="card">
                        <h3>Descrizione dell'annuncio</h3>
                        <div class="descrizione">${prodotto.descrizione || 'Nessuna descrizione inserita.'}</div>
                    </div>
                </div>
                
                <!-- DESTRA: Prezzo e Contatti -->
                <div class="colonna-destra">
                    <div class="card">
                        <div class="badges">
                            <span class="badge ${classeStato}">${iconaStato} ${stato}</span>
                            ${prodotto.categoria ? `<span class="badge categoria">${prodotto.categoria}</span>` : ''}
                            <span class="badge">${prodotto.condizione || 'Usato'}</span>
                        </div>
                        
                        <h1>${prodotto.titolo}</h1>
                        <span class="codice-articolo">Rif: #${codice}</span>
                        <div class="prezzo">${prezzo}</div>
                        
                        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">
                        
                        <a href="${linkWA}" target="_blank" class="btn-whatsapp ${btnDisabilitato}">
                            💬 ${testoBtn}
                        </a>
                    </div>
                </div>
            </div>
        `;
    }

    window.cambiaFoto = function(miniatura, url) {
        document.getElementById('foto-grande').src = url;
        document.querySelectorAll('.miniature img').forEach(img => img.classList.remove('attiva'));
        miniatura.classList.add('attiva');
    }

    caricaProdotto();
</script>
</body>
</html>
